<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="th-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE19C" stop-opacity="1" />
      <stop offset="35%" stop-color="#E5B869" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#C59B27" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B0C0E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="th-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16181E" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>
  </defs>
  <!-- Background circular disc -->
  <circle cx="256" cy="256" r="240" fill="url(#th-bg)" stroke="#E5B869" stroke-width="8" stroke-opacity="0.4" />
  <!-- Inner architectural ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#E5B869" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6" />
  <!-- Ambient light glow aura -->
  <circle cx="256" cy="256" r="120" fill="url(#th-glow)" />
  <!-- Center focal luminaire -->
  <circle cx="256" cy="256" r="42" fill="#E5B869" />
  <circle cx="256" cy="256" r="20" fill="#FFF8EE" />
</svg>
